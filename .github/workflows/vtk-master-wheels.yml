name: Build/Test VTK Master Wheels

# Builds VTK master on all three operating systems with the command this package ships,
# then runs PyVista's core test suite against the wheel.
on:
  schedule:
  - cron: 0 7 * * *
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
    # A pushed-over pull request run is cancelled; nightly and manual runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  build-vtk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.14']
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_MAXSIZE: 1G
      SCCACHE_CACHE_SIZE: 1G
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Checkout VTK master (pinned to nightly date-stamp commit)
      shell: bash
      run: |
        # Depth 200 since we want to ensure we capture kwrobot's date-stamp commit
        git clone --depth 200 --branch master https://github.com/kitware/vtk vtk-src
        cd vtk-src

        NIGHTLY_SHA="$(git log --grep='^VTK Nightly Date Stamp$' -n 1 --format=%H)"
        if [ -z "$NIGHTLY_SHA" ]; then
          echo "No 'VTK Nightly Date Stamp' commit found in the last 200 commits on master"
          exit 1
        fi

        echo "Pinning build to VTK's nightly date-stamp commit: $NIGHTLY_SHA"
        git checkout "$NIGHTLY_SHA"
        echo "VTK_NIGHTLY_SHA=$NIGHTLY_SHA" >> "$GITHUB_ENV"

        # Commits since the previous nightly date-stamp, grouped by merge topic.
        PREV_NIGHTLY_SHA="$(git log --grep='^VTK Nightly Date Stamp$' --skip=1 -n 1 --format=%H)"
        BASE_URL="https://gitlab.kitware.com/vtk/vtk/-/commit"
        {
          if [ -z "$PREV_NIGHTLY_SHA" ]; then
            echo "Could not find a previous nightly date-stamp commit within the last 200 commits;"
            echo "showing only the pinned commit: [\`${NIGHTLY_SHA:0:8}\`](${BASE_URL}/${NIGHTLY_SHA})"
          else
            n_commits="$(git rev-list --count "${PREV_NIGHTLY_SHA}..${NIGHTLY_SHA}")"
            echo "Commits since the previous nightly date-stamp ([\`${PREV_NIGHTLY_SHA:0:8}\`](${BASE_URL}/${PREV_NIGHTLY_SHA})):"
            echo
            echo "[Compare on GitLab](https://gitlab.kitware.com/vtk/vtk/-/compare/${PREV_NIGHTLY_SHA}...${NIGHTLY_SHA})"
            echo
            echo "<details>"
            echo "<summary>${n_commits} commits (grouped by merge topic)</summary>"
            echo
            git log --first-parent --reverse --format='%H%x09%h%x09%s%x09%an' \
              "${PREV_NIGHTLY_SHA}..${NIGHTLY_SHA}" |
              while IFS=$'\t' read -r full short subject author; do
                echo "- [\`${short}\`](${BASE_URL}/${full}) ${subject} (${author})"
                read -r -a parents <<<"$(git log -1 --format='%P' "$full")"
                if [ "${#parents[@]}" -ge 2 ]; then
                  # Second parent is the topic branch tip; list what it added over the mainline.
                  git log --no-merges --reverse --format='%H%x09%h%x09%s%x09%an' \
                    "${parents[0]}..${parents[1]}" |
                    while IFS=$'\t' read -r sfull sshort ssubject sauthor; do
                      echo "  - [\`${sshort}\`](${BASE_URL}/${sfull}) ${ssubject} (${sauthor})"
                    done
                fi
              done
            echo
            echo "</details>"
          fi
        } > "$GITHUB_WORKSPACE/vtk-commit-range.md"

    - name: Upload VTK commit range
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: vtk-commit-range-${{ runner.os }}
        path: vtk-commit-range.md

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      run: brew install ccache

    - name: Install pyvista-build
      shell: bash
        # `--manylinux` mounts this installed package into the container.
      run: python -m pip install --upgrade pip .

      # An artifact, not actions/cache: the repository's shared cache quota evicts a
      # once-a-day entry before the next nightly can restore it.
    - name: Find the newest compiler cache from this branch or main
      id: find-compiler-cache
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        # Newest first: this branch's own upload, else main's, from this repository only.
        if ! run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=compiler-cache-${RUNNER_OS}&per_page=50" \
          --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] as $a
            | ([$a[] | select(.workflow_run.head_branch == env.BRANCH)] + [$a[] | select(.workflow_run.head_branch == "main")])[0].workflow_run.id // empty')"; then
          echo "::warning::Could not list the compiler cache artifacts; building cold"
          run_id=""
        fi
        if [ -n "$run_id" ]; then
          echo "Restoring the compiler cache uploaded by run $run_id"
        else
          echo "No compiler cache artifact found; building cold"
        fi
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Restore compiler cache
      if: steps.find-compiler-cache.outputs.run-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      continue-on-error: true
      with:
        name: compiler-cache-${{ runner.os }}
        run-id: ${{ steps.find-compiler-cache.outputs.run-id }}
        github-token: ${{ github.token }}
        path: compiler-cache

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1.13.0
      if: runner.os == 'Windows'

    - name: Set up sccache (Windows)
      if: runner.os == 'Windows'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba   # v0.0.9

    - name: Build VTK wheel
      shell: bash
        # --manylinux (Linux) builds inside the manylinux_2_28 container.
      env:
        MANYLINUX: ${{ runner.os == 'Linux' && '--manylinux' || '' }}
      run: |
        pyvista-build vtk $MANYLINUX --yes --verbose \
          --source vtk-src --build-dir vtk-build --compiler-cache auto --cache-dir compiler-cache \
          --version-suffix "dev0+g${VTK_NIGHTLY_SHA:0:8}"

    - name: Show the full build log
      if: failure()
      shell: bash
      run: |
        if [ ! -f vtk-build/build.log ]; then
          echo "The build stopped before compiling."
        elif grep -Eq '^ninja: (build stopped|error)' vtk-build/build.log; then
          cat vtk-build/build.log
        else
          echo "The build log shows no compile failure. See the failing step above."
        fi

      # Fork pull requests read the cache but never upload one.
    - name: Upload compiler cache
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: compiler-cache-${{ runner.os }}
        path: compiler-cache
        compression-level: 0
        retention-days: 7

    - name: Upload VTK wheel
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: vtk-wheel-${{ runner.os }}-py${{ matrix.python-version }}
        path: vtk-build/wheelhouse/*.whl

  test:
    needs: build-vtk
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYVISTA_OFF_SCREEN: 'true'
      PYVISTA_REF: main   # the PyVista ref to test the wheel with
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download VTK wheel artifact
      id: download-wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      continue-on-error: true
      with:
        name: vtk-wheel-${{ runner.os }}-py${{ matrix.python-version }}
        path: vtk-wheel

    - name: Skip if wheel build failed
      if: steps.download-wheel.outcome != 'success'
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        echo "No VTK wheel artifact for $RUNNER_OS/py$PYTHON_VERSION"
        exit 1

    - name: Set up headless display
      if: runner.os != 'macOS'
      uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79   # v4.2

    - name: Clone PyVista
      shell: bash
      run: git clone --depth=1 --branch "$PYVISTA_REF" --single-branch https://github.com/pyvista/pyvista.git pyvista

    - name: Install the wheel and PyVista
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install vtk-wheel/*.whl
        python -m pip install --editable ./pyvista --group ./pyvista/pyproject.toml:test

    - name: Confirm the built wheel is the installed VTK
      shell: bash
      run: python -c "from importlib.metadata import version; v = version('vtk'); print(v); assert '.dev0+g' in v"

    - name: Core tests
      shell: bash
      working-directory: pyvista
      run: python -m pytest tests/core -n auto
