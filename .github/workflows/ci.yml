name: CI

# `pull_request` is deliberately unfiltered: filtering it by base branch would
# skip every pull request in a stack that does not target main.
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
      with:
        enable-cache: false
    - run: uv sync --group dev
    - run: uv run pre-commit run --all-files --show-diff-on-failure
      env:
          # This hook exists to stop *local* commits straight to main; it
          # would always fail here since CI checks out that branch/tag directly.
        SKIP: no-commit-to-branch

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
        - os: macos-latest
          python-version: '3.14'
        - os: windows-latest
          python-version: '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
      with:
        enable-cache: false
    - run: uv sync --group dev --python ${{ matrix.python-version }}
    - run: uv run pytest
    - run: mv .coverage .coverage.test-${{ matrix.os }}-${{ matrix.python-version }}
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: coverage-test-${{ matrix.os }}-${{ matrix.python-version }}
        path: .coverage.test-${{ matrix.os }}-${{ matrix.python-version }}
        include-hidden-files: true

  coverage:
      # Combine the matrix's coverage and gate the total and the patch.
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
      with:
        enable-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
      with:
        pattern: coverage-*
        path: coverage-data
        merge-multiple: true
    - run: uv run --only-group coverage coverage combine coverage-data
    - run: uv run --only-group coverage coverage xml
    - run: uv run --only-group coverage coverage report --fail-under=95
    - name: Patch coverage
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      run: uv run --only-group coverage diff-cover coverage.xml --compare-branch "origin/$GITHUB_BASE_REF" --fail-under 95 --format markdown:diff-cover.md
    - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      run: cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" || true
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
      if: ${{ !cancelled() }}
      with:
        files: ./coverage.xml
        flags: tests
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typing:
      # mypy's Cobertura report counts a line as covered when every expression on
      # it has a precise type, so codecov shows typing coverage next to test coverage.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
      with:
        enable-cache: false
    - run: uv sync --group dev --python 3.14
    - run: uv run --no-sync mypy --cobertura-xml-report typing-coverage --txt-report typing-coverage
    - run: cat typing-coverage/index.txt
    - run: uv run --no-sync python .github/exclude_typing_lines.py typing-coverage/cobertura.xml
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
      with:
        files: ./typing-coverage/cobertura.xml
        flags: typing
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dist:
    needs: [pre-commit, test, coverage, typing]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
      with:
        enable-cache: false
    - run: uv build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: dist
        path: dist/

  publish:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # release/v1
