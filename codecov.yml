# Test coverage and typing coverage are uploaded under separate flags so
# neither number hides the other.
flags:
  tests:
    paths: [pyvista_build/]
    carryforward: true
  typing:
    paths: [pyvista_build/]
    carryforward: true

coverage:
  status:
    project:
      tests:
        flags: [tests]
        target: 95%
      typing:
        flags: [typing]
        target: 97.5%
    patch:
      tests:
        flags: [tests]
        target: 95%
      typing:
        flags: [typing]
        target: 98.5%
